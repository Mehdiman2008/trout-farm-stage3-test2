# =====================================================================
#  مزرعه قزل‌آلا — پیکربندی مرکزی  /  Trout farm — central configuration
# ---------------------------------------------------------------------
#  source: OBS = Observed / Provided Data (داده واقعی مزرعه)
#          MA  = Modelling Assumption (فرض مدل، قابل تغییر)
#          DER = Derived (محاسبه‌شده از بقیه پارامترها، فقط نمایشی)
#
#  هیچ عدد مهمی نباید در کد پایتون hard-code شود (Fix 5).
#  تغییر مقدارها از طریق تب «فرضیات» در داشبورد انجام می‌شود و در
#  جدول assumption_overrides ذخیره می‌گردد؛ این فایل دست‌نخورده می‌ماند.
# =====================================================================

meta:
  schema_version: 1
  stage: "stage-1"
  base_currency: "toman"

groups:
  - id: farm
    title_fa: "مزرعه و استخرها"
  - id: water
    title_fa: "آب و اکسیژن"
  - id: capacity
    title_fa: "ظرفیت استخر"
  - id: growth
    title_fa: "رشد"
  - id: heterogeneity
    title_fa: "پراکندگی رشد داخل cohort"
  - id: mortality
    title_fa: "تلفات"
  - id: feed
    title_fa: "خوراک"
  - id: price
    title_fa: "قیمت فروش"
  - id: egg
    title_fa: "تخم"
  - id: cost
    title_fa: "هزینه ثابت"
  - id: finance
    title_fa: "مالی و سرمایه در گردش"
  - id: fx
    title_fa: "ارز / بنچمارک سرمایه"
  - id: stochastic
    title_fa: "پارامترهای عدم قطعیت"
  - id: plan
    title_fa: "سیاست پایه برداشت (برای forecast)"
  - id: planning
    title_fa: "برنامه‌ریزی (مرحله ۲)"
  - id: saleability
    title_fa: "سهولت فروش / دسترسی مشتری"
  - id: run
    title_fa: "اجرا و افق زمانی"

parameters:

  # ------------------------------------------------------------- farm
  - key: farm.total_ponds
    group: farm
    label_fa: "تعداد کل استخر"
    value: 21
    unit: "عدد"
    source: OBS
    type: int
    min: 1
    max: 200
  - key: farm.operational_ponds
    group: farm
    label_fa: "استخر عملیاتی هدف"
    value: 19
    unit: "عدد"
    source: OBS
    type: int
    min: 1
    max: 200
  - key: farm.reserve_ponds
    group: farm
    label_fa: "استخر رزرو"
    value: 2
    unit: "عدد"
    source: OBS
    type: int
    min: 0
    max: 50
  - key: farm.pond_volume_m3
    group: farm
    label_fa: "حجم هر استخر"
    value: 20
    unit: "m³"
    source: OBS
    type: float
    min: 1
    max: 500

  # ------------------------------------------------------------ water
  - key: water.flow_l_s
    group: water
    label_fa: "دبی هر استخر"
    value: 15.0
    unit: "L/s"
    source: OBS
    type: float
  - key: water.temperature_c
    group: water
    label_fa: "دمای آب"
    value: 11.0
    unit: "°C"
    source: OBS
    type: float
  - key: water.do_inlet_mg_l
    group: water
    label_fa: "DO ورودی"
    value: 8.0
    unit: "mg/L"
    source: OBS
    type: float
  - key: water.do_outlet_mg_l
    group: water
    label_fa: "DO خروجی"
    value: 6.0
    unit: "mg/L"
    source: OBS
    type: float
  - key: water.min_safe_do_outlet_mg_l
    group: water
    label_fa: "حداقل DO خروجی ایمن"
    value: 5.5
    unit: "mg/L"
    source: MA
    type: float
  - key: water.o2_consumption_mg_per_kg_h
    group: water
    label_fa: "مصرف اکسیژن ویژه"
    value: 350.0
    unit: "mg O₂/kg/h"
    source: MA
    type: float
    note_fa: "بچه‌ماهی قزل‌آلا زیر ۲۰ گرم در ۱۱ درجه"

  # --------------------------------------------------------- capacity
  - key: capacity.fish_per_pond_1g
    group: capacity
    label_fa: "ظرفیت در ۱ گرم"
    value: 40000
    unit: "قطعه/استخر"
    source: OBS
    type: int
  - key: capacity.fish_per_pond_2g
    group: capacity
    label_fa: "ظرفیت در ۲ گرم"
    value: 27500
    unit: "قطعه/استخر"
    source: OBS
    type: int
    note_fa: "بازه تجربی ۲۵٬۰۰۰ تا ۳۰٬۰۰۰ — میانه گرفته شده"
  - key: capacity.fish_per_pond_15g
    group: capacity
    label_fa: "ظرفیت در ۱۵ گرم"
    value: 13500
    unit: "قطعه/استخر"
    source: OBS
    type: int
  - key: capacity.no_constraint_below_g
    group: capacity
    label_fa: "وزنی که تا زیر آن محدودیت ظرفیت اعمال نمی‌شود"
    value: 1.0
    unit: "گرم"
    source: OBS
    type: float
    note_fa: "۸۰ روز اول تا حدود ۱ گرم"
  - key: capacity.target_utilisation
    group: capacity
    label_fa: "سقف هشدار درصد اشغال استخر"
    value: 0.95
    unit: "نسبت"
    source: MA
    type: float
    min: 0.1
    max: 1.5

  # ----------------------------------------------------------- growth
  - key: growth.start_weight_g
    group: growth
    label_fa: "وزن مبنای روز صفر (تخم/لارو)"
    value: 0.05
    unit: "گرم"
    source: MA
    type: float
    min: 0.005
    max: 1.0
    note_fa: "برای درون‌یابی لگاریتمی منحنی رشد در ۸۰ روز اول"
  - key: growth.days_to_1g
    group: growth
    label_fa: "تخم → ۱ گرم"
    value: 80
    unit: "روز"
    source: OBS
    type: int
  - key: growth.days_1g_to_2g
    group: growth
    label_fa: "۱ → ۲ گرم"
    value: 20
    unit: "روز"
    source: OBS
    type: int
  - key: growth.days_2g_to_10g
    group: growth
    label_fa: "۲ → ۱۰ گرم"
    value: 30
    unit: "روز"
    source: OBS
    type: int
  - key: growth.days_10g_to_15g
    group: growth
    label_fa: "۱۰ → ۱۵ گرم"
    value: 10
    unit: "روز"
    source: OBS
    type: int
  - key: growth.sgr_after_15g_per_day
    group: growth
    label_fa: "نرخ رشد ویژه بعد از ۱۵ گرم"
    value: 0.030
    unit: "ln(g)/روز"
    source: MA
    type: float
    note_fa: "فقط اگر ماهی بعد از ۱۵ گرم نگه داشته شود"
  - key: growth.speed_multiplier
    group: growth
    label_fa: "ضریب سرعت رشد کل مزرعه"
    value: 1.0
    unit: "ضریب"
    source: MA
    type: float
    min: 0.5
    max: 1.6
    note_fa: "۱.۰ = معمول؛ >۱ سریع‌تر، <۱ کندتر"

  # -------------------------------------------------- heterogeneity
  - key: heterogeneity.distribution
    group: heterogeneity
    label_fa: "نوع توزیع وزن داخل cohort"
    value: "lognormal"
    unit: "-"
    source: MA
    type: choice
    choices: ["lognormal", "normal_truncated"]
  - key: heterogeneity.cv_at_1g
    group: heterogeneity
    label_fa: "ضریب تغییرات وزن (CV) در ۱ گرم"
    value: 0.12
    unit: "نسبت"
    source: MA
    type: float
    min: 0.0
    max: 0.6
    note_fa: "بازه پیشنهادی اولیه ۱۰٪ تا ۱۵٪"
  - key: heterogeneity.cv_at_15g
    group: heterogeneity
    label_fa: "ضریب تغییرات وزن (CV) در ۱۵ گرم"
    value: 0.18
    unit: "نسبت"
    source: MA
    type: float
    min: 0.0
    max: 0.8
    note_fa: "پراکندگی وزن با افزایش سن بیشتر می‌شود"
  - key: heterogeneity.slow_quantile
    group: heterogeneity
    label_fa: "چندک گروه کندرشد"
    value: 0.10
    unit: "نسبت"
    source: MA
    type: float
  - key: heterogeneity.fast_quantile
    group: heterogeneity
    label_fa: "چندک گروه تندرشد"
    value: 0.90
    unit: "نسبت"
    source: MA
    type: float

  # -------------------------------------------------------- mortality
  - key: mortality.cum_at_1g
    group: mortality
    label_fa: "تلفات تجمعی تا ۱ گرم"
    value: 0.28
    unit: "نسبت"
    source: OBS
    type: float
    min: 0.0
    max: 0.95
  - key: mortality.cum_at_2g
    group: mortality
    label_fa: "تلفات تجمعی تا ۲ گرم"
    value: 0.32
    unit: "نسبت"
    source: OBS
    type: float
  - key: mortality.cum_at_5g
    group: mortality
    label_fa: "تلفات تجمعی تا ۵ گرم"
    value: 0.35
    unit: "نسبت"
    source: OBS
    type: float
  - key: mortality.cum_at_10g
    group: mortality
    label_fa: "تلفات تجمعی تا ۱۰ گرم"
    value: 0.38
    unit: "نسبت"
    source: OBS
    type: float
  - key: mortality.cum_at_15g
    group: mortality
    label_fa: "تلفات تجمعی تا ۱۵ گرم"
    value: 0.40
    unit: "نسبت"
    source: OBS
    type: float
  - key: mortality.front_load_exponent
    group: mortality
    label_fa: "شدت front-load بودن تلفات مرحله تخم→۱ گرم"
    value: 0.5
    unit: "توان"
    source: MA
    type: float
    min: 0.2
    max: 1.0
    note_fa: "کمتر از ۱ یعنی تلفات در روزهای اول متمرکزتر است"
  - key: mortality.daily_after_15g
    group: mortality
    label_fa: "تلفات روزانه بعد از ۱۵ گرم"
    value: 0.0002
    unit: "نسبت/روز"
    source: MA
    type: float

  # ------------------------------------------------------------- feed
  - key: feed.fcr
    group: feed
    label_fa: "FCR پایه"
    value: 1.0
    unit: "kg خوراک/kg رشد"
    source: OBS
    type: float
    min: 0.5
    max: 2.5
  - key: feed.fcr_sensitivity
    group: feed
    label_fa: "بازه حساسیت FCR"
    value: [0.9, 1.0, 1.1, 1.2]
    unit: "لیست"
    source: MA
    type: list_float
  - key: feed.charge_growth_of_dead_fish
    group: feed
    label_fa: "احتساب خوراک ماهی‌های تلف‌شده در بازه"
    value: true
    unit: "بله/خیر"
    source: MA
    type: bool
  - key: feed.price_table
    effective_dated: true
    group: feed
    label_fa: "جدول قیمت خوراک بر اساس وزن ماهی"
    source: OBS
    type: table
    columns:
      - {key: w_min, label_fa: "از وزن (g)", type: float}
      - {key: w_max, label_fa: "تا وزن (g)", type: float}
      - {key: name, label_fa: "نام/سایز خوراک", type: str}
      - {key: price, label_fa: "قیمت (تومان/kg)", type: float}
    value:
      - {w_min: 0.00, w_max: 0.20, name: "SFP-00", price: 312000}
      - {w_min: 0.20, w_max: 0.50, name: "FP-0",   price: 312000}
      - {w_min: 0.50, w_max: 1.50, name: "FP-1",   price: 310000}
      - {w_min: 1.50, w_max: 3.00, name: "FP-2",   price: 308000}
      - {w_min: 3.00, w_max: 5.00, name: "FP-3",   price: 305000}
      - {w_min: 5.00, w_max: 7.00, name: "FP-4",   price: 298000}
      - {w_min: 7.00, w_max: 10.00, name: "FP-5",  price: 295000}
      - {w_min: 10.00, w_max: 20.00, name: "GR-1", price: 199000}
    note_fa: "قیمت ثابت ۳۵۰٬۰۰۰ حذف شد؛ باند ۰-۰.۲ گرم با قیمت باند ۰.۲-۰.۵ پر شده است (MA)"
  - key: feed.reorder_alert_days
    group: feed
    label_fa: "هشدار کمبود خوراک زیر چند روز موجودی"
    value: 14
    unit: "روز"
    source: MA
    type: int

  # ------------------------------------------------------------ price
  - key: price.base_1g
    effective_dated: true
    group: price
    label_fa: "قیمت فروش در ۱ گرم"
    value: 11000
    unit: "تومان/قطعه"
    source: OBS
    type: float
  - key: price.slope_per_gram
    effective_dated: true
    group: price
    label_fa: "افزایش قیمت به ازای هر گرم بیشتر"
    value: 800
    unit: "تومان/گرم"
    source: OBS
    type: float

  # -------------------------------------------------------------- egg
  - key: price.max_priced_weight_g
    group: price
    label_fa: "حداکثر وزنی که منحنی قیمت برای آن معتبر است"
    value: 15.0
    unit: "گرم"
    source: MA
    type: float
    note_fa: >-
      بالاتر از این وزن داده قیمت نداریم؛ قیمت در همین سقف نگه داشته می‌شود و
      برون‌یابی نمی‌شود. cohortهای بالاتر از این وزن در برنامه علامت‌گذاری می‌شوند.

  # -------------------------------------------------------------- egg
  - key: egg.base_price
    effective_dated: true
    group: egg
    label_fa: "قیمت پایه تخم"
    value: 6000
    unit: "تومان/عدد"
    source: OBS
    type: float
  - key: egg.monthly_guideline
    group: egg
    label_fa: "راهنمای خرید ماهانه تخم (Planning Guideline)"
    value: 300000
    unit: "عدد/ماه"
    source: MA
    type: int
    note_fa: >-
      محدودیت فیزیکی مطلق نیست. داده واقعی تیر/جولای ۲۰۲۶ نشان می‌دهد
      ۳۲۰٬۰۰۰ عدد خرید شده است. عبور از این عدد فقط هشدار برنامه‌ریزی است.
  - key: egg.enforce_hard_monthly_max
    group: egg
    label_fa: "اعمال سقف سخت ماهانه تخم"
    value: false
    unit: "بله/خیر"
    source: MA
    type: bool
    note_fa: "اگر روشن شود، عبور از سقف سخت به‌عنوان خطا (fail) گزارش می‌شود."
  - key: egg.hard_monthly_max
    group: egg
    label_fa: "سقف سخت ماهانه تخم (در صورت فعال بودن)"
    value: 400000
    unit: "عدد/ماه"
    source: MA
    type: int
  - key: egg.annual_scenarios
    group: egg
    label_fa: "سناریوهای حجم سالانه تخم"
    value: [2000000, 2500000, 3000000]
    unit: "عدد/سال"
    source: OBS
    type: list_float

  # ------------------------------------------------------------- cost
  - key: cost.fixed_monthly
    effective_dated: true
    group: cost
    label_fa: "هزینه ثابت ماهانه مزرعه"
    value: 120000000
    unit: "تومان/ماه"
    source: OBS
    type: float
    note_fa: "farm-level است، نه per batch. Baseline Assumption؛ هزینه واقعی ثبت‌شده بر آن اولویت دارد."
  - key: cost.fixed_cost_mode
    group: cost
    label_fa: "نحوه ترکیب هزینه ثابت پایه با هزینه‌های واقعی ثبت‌شده"
    value: "top_up"
    unit: "حالت"
    source: MA
    type: choice
    choices: ["top_up", "baseline_only", "actual_only"]
    note_fa: >-
      جلوگیری از double counting.
      top_up = در هر ماه فقط اختلاف تا هزینه ثابت پایه اضافه می‌شود (پیش‌فرض).
      baseline_only = فقط هزینه ثابت پایه (هزینه‌های واقعی جداگانه شمرده نمی‌شوند).
      actual_only = فقط هزینه‌های واقعی ثبت‌شده.
  - key: cost.categories
    group: cost
    label_fa: "دسته‌بندی هزینه‌های جانبی"
    value: ["نگهداری و تعمیرات", "برق و سوخت", "دستمزد", "حمل و نقل",
            "دارو و بهداشت", "اداری", "سایر"]
    unit: "لیست"
    source: MA
    type: list_str
    note_fa: "کاربر می‌تواند دسته‌ها را اضافه/کم کند؛ «سایر» همیشه لازم است."

  # ---------------------------------------------------------- finance
  - key: finance.supplier_credit_days
    group: finance
    label_fa: "مهلت پرداخت به تأمین‌کننده"
    value: 0
    unit: "روز"
    source: MA
    type: int
  - key: finance.customer_payment_delay_days
    group: finance
    label_fa: "تأخیر دریافت از مشتری"
    value: 0
    unit: "روز"
    source: MA
    type: int
  - key: finance.working_capital_available
    group: finance
    label_fa: "سرمایه در گردش موجود / فرض پایه"
    value: 8.0e9
    unit: "تومان"
    source: MA
    type: float
    note_fa: >-
      Initial / Baseline Working Capital Assumption — یک ورودی مرجع است،
      نه خروجی ثابت optimizer. سرمایه در گردش موردنیاز با هر تراکنش واقعی
      (تخم، خوراک، فروش، هزینه، زمان‌بندی پرداخت) دوباره محاسبه می‌شود.
  - key: finance.sale_immediate_share
    group: finance
    label_fa: "سهم پرداخت نقدی در زمان فروش"
    value: 0.50
    unit: "نسبت"
    source: MA
    type: float
    min: 0.0
    max: 1.0
    note_fa: >-
      شرایط پرداخت مشتری. باقیمانده با تأخیر دریافت می‌شود.
      درآمد در تاریخ فروش شناسایی می‌شود ولی وجه نقد طبق همین جدول می‌آید.
      پرداخت واقعی ثبت‌شده همیشه بر این فرض اولویت دارد.
  - key: finance.sale_deferred_delay_days
    group: finance
    label_fa: "تأخیر دریافت باقیمانده فروش"
    value: 45
    unit: "روز"
    source: MA
    type: int
    min: 0
    max: 365
    note_fa: "حدود ۱.۵ ماه پس از فروش."
  - key: finance.customer_upfront_share
    group: finance
    label_fa: "سهم دریافت نقدی در زمان فروش"
    value: 0.50
    unit: "نسبت"
    source: MA
    type: float
    min: 0.0
    max: 1.0
    note_fa: >-
      منطق معمول: ۵۰٪ هنگام فروش و ۵۰٪ حدود ۴۵ روز بعد.
      تاریخ شناسایی درآمد از تاریخ دریافت وجه جداست.
      پرداخت واقعی ثبت‌شده همیشه بر این فرض اولویت دارد.
  - key: finance.customer_balance_delay_days
    group: finance
    label_fa: "تأخیر دریافت باقیمانده وجه فروش"
    value: 45
    unit: "روز"
    source: MA
    type: int
    min: 0
    max: 365
  - key: finance.wc_forecast_days
    group: finance
    label_fa: "افق پیش‌بینی اوج سرمایه در گردش"
    value: 180
    unit: "روز"
    source: MA
    type: int
    min: 30
    max: 730
  - key: finance.opening_cash
    group: finance
    label_fa: "موجودی نقد ابتدای دوره"
    value: 0
    unit: "تومان"
    source: MA
    type: float
  - key: finance.cpi_inflation
    group: finance
    label_fa: "تورم عمومی سالانه"
    value: 0.45
    unit: "نسبت/سال"
    source: MA
    type: float
  - key: finance.feed_inflation
    group: finance
    label_fa: "تورم قیمت خوراک"
    value: 0.45
    unit: "نسبت/سال"
    source: MA
    type: float
  - key: finance.egg_inflation
    group: finance
    label_fa: "تورم قیمت تخم"
    value: 0.40
    unit: "نسبت/سال"
    source: MA
    type: float
  - key: finance.sale_price_inflation
    group: finance
    label_fa: "تورم قیمت فروش بچه‌ماهی"
